<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="City Life: Exploring, Experiencing &amp; Navigating the Chaos We Call Home — AI-driven urban discovery, SafeRoute intelligence, heritage audio tours, and real-time smart city insights." />
    <meta name="theme-color" content="#090d16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="City Life" />
    
    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- OpenGraph / Social Share Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="City Life — Global Urban AI Navigator &amp; SafeRoute" />
    <meta property="og:description" content="Real-time telemetry, live weather, verified landmarks, crowdsourced hazard alerts &amp; safe walking corridors for cities worldwide." />
    <meta property="og:image" content="/favicon.svg" />

    <title>City Life: Exploring, Experiencing &amp; Navigating the Chaos</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register PWA Service Worker for offline performance
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration note:', err.message);
          });
        });
      }
    </script>
  </body>
</html>
