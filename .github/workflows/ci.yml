name: Prarush CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Test, Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Prarush Automated Engine Tests
        run: node src/test-prarush.js

      - name: Run Linter
        run: npm run lint

      - name: Run Production Vite Build
        run: npm run build

      - name: Verify Mobile Scaffolding Integrity
        run: |
          node -e "const fs = require('fs'); const assert = require('assert'); assert(fs.existsSync('android/build.gradle') && fs.existsSync('ios/App/Podfile'), 'Native Android/iOS project files missing'); console.log('✅ Mobile scaffolding verified.');"
